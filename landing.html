<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>段默文 - 主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; font-family: 'Inter', sans-serif; background: #050507; }
    
    .landing {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #050507; z-index: 1000;
      cursor: pointer;
    }
    
    .layer {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    
    /* 表层 - 完全可见，白色 */
    .surface-text {
      font-size: clamp(48px, 10vw, 120px);
      font-weight: 700; letter-spacing: -0.02em;
      color: #ffffff;
    }
    
    /* 底层 - 通过 mask 实现光圈揭示 */
    .underlying {
      -webkit-mask-image: radial-gradient(circle 260px at var(--mx, 50%) var(--my, 50%), 
        black 0%, 
        rgba(0,0,0,0.8) 60%,
        transparent 100%);
      mask-image: radial-gradient(circle 260px at var(--mx, 50%) var(--my, 50%), 
        black 0%, 
        rgba(0,0,0,0.8) 60%,
        transparent 100%);
    }
    
    .underlying h1 {
      font-size: clamp(48px, 10vw, 120px);
      font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #00d992, #00b4d8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(0, 217, 146, 0.7));
    }
    
    .underlying p { 
      margin-top: 20px; 
      font-size: 20px; 
      color: #a8a8b0;
    }
    
    /* 光圈边框 - 绿色圆环 */
    .cursor-circle {
      position: fixed; width: 220px; height: 220px;
      border: 2px solid rgba(0, 217, 146, 0.6);
      border-radius: 50%; pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1001;
      box-shadow: 0 0 40px rgba(0, 217, 146, 0.4),
                  inset 0 0 40px rgba(0, 217, 146, 0.15);
    }
    
    .hint {
      position: absolute; bottom: 60px; left: 50%;
      transform: translateX(-50%);
      font-size: 13px; color: #6b6b78;
      animation: pulse 2s infinite;
      letter-spacing: 0.1em;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    
    .exit { animation: fadeExit 0.6s forwards; }
    @keyframes fadeExit { 
      to { opacity: 0; visibility: hidden; } 
    }
  </style>
</head>
<body>
  <div class="cursor-circle" id="cursor"></div>
  
  <section class="landing" id="landing">
    <!-- 表层：完全可见 -->
    <div class="layer">
      <div class="surface-text">I'm deMo1</div>
    </div>
    
    <!-- 底层：只有光圈内可见 -->
    <div class="layer underlying" id="underlying">
      <h1>我是段默文</h1>
      <p>C++ 后端开发者</p>
    </div>
    
    <div class="hint">点击任意位置进入网站 ↓</div>
  </section>

  <script>
    const cursor = document.getElementById('cursor');
    const underlying = document.getElementById('underlying');
    const landing = document.getElementById('landing');
    
    // 鼠标移动 - 光圈跟随
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
      
      // 更新 mask 位置
      underlying.style.setProperty('--mx', e.clientX + 'px');
      underlying.style.setProperty('--my', e.clientY + 'px');
    });
    
    // 点击淡出
    landing.addEventListener('click', () => {
      landing.classList.add('exit');
      setTimeout(() => {
        landing.style.display = 'none';
        window.location.href = 'index.html#main';
      }, 600);
    });
  </script>
</body>
</html>
