<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>段默文 - 主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; font-family: 'Inter', sans-serif; background: #050507; color: #f0f0f2; }
    
    .landing {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #050507; z-index: 1000;
      cursor: pointer;
    }
    
    .layer {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    
    /* 表层 - 完全隐藏，只保留极淡的轮廓 */
    .surface-text {
      font-size: clamp(48px, 10vw, 120px);
      font-weight: 700; letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.03); /* 几乎完全透明 */
      text-shadow: none;
      transition: all 0.3s ease;
    }
    
    /* 底层 - 光圈揭示，明亮清晰 */
    .underlying {
      background: radial-gradient(circle 320px at var(--mx, 50%) var(--my, 50%), 
        transparent 0%, 
        rgba(5, 5, 7, 0.95) 40%,
        rgba(5, 5, 7, 0.99) 100%);
    }
    
    .underlying h1 {
      font-size: clamp(48px, 10vw, 120px);
      font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #00d992, #00b4d8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 40px rgba(0, 217, 146, 0.6))
             drop-shadow(0 0 80px rgba(0, 180, 216, 0.3));
    }
    
    .underlying p { 
      margin-top: 24px; 
      font-size: 24px; 
      color: rgba(240, 240, 242, 0.95);
      text-shadow: 0 0 30px rgba(0, 217, 146, 0.5);
      font-weight: 300;
      letter-spacing: 0.05em;
    }
    
    /* 光圈边框 - 明显的绿色光晕 */
    .cursor-circle {
      position: fixed; width: 220px; height: 220px;
      border: 2px solid rgba(0, 217, 146, 0.7);
      border-radius: 50%; pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1001; mix-blend-mode: screen;
      box-shadow: 0 0 50px rgba(0, 217, 146, 0.4),
                  inset 0 0 50px rgba(0, 217, 146, 0.15);
      animation: glow 2s ease-in-out infinite;
    }
    
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 50px rgba(0, 217, 146, 0.4), inset 0 0 50px rgba(0, 217, 146, 0.15); }
      50% { box-shadow: 0 0 70px rgba(0, 217, 146, 0.6), inset 0 0 70px rgba(0, 217, 146, 0.25); }
    }
    
    .hint {
      position: absolute; bottom: 60px; left: 50%;
      transform: translateX(-50%);
      font-size: 14px; color: rgba(107, 107, 120, 0.8);
      animation: pulse 2s infinite;
      letter-spacing: 0.1em;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: translateX(-50%) translateY(0); }
      50% { opacity: 0.8; transform: translateX(-50%) translateY(-5px); }
    }
    
    .exit { animation: fadeExit 0.6s forwards; }
    @keyframes fadeExit { 
      to { opacity: 0; visibility: hidden; transform: scale(1.05); } 
    }
  </style>
</head>
<body>
  <div class="cursor-circle" id="cursor"></div>
  
  <section class="landing" id="landing">
    <div class="layer">
      <div class="surface-text">I'm deMo1</div>
    </div>
    <div class="layer underlying" id="underlying">
      <h1>我是段默文</h1>
      <p>C++ 后端开发者</p>
    </div>
    <div class="hint">点击任意位置进入网站 ↓</div>
  </section>

  <script>
    const cursor = document.getElementById('cursor');
    const underlying = document.getElementById('underlying');
    const landing = document.getElementById('landing');
    
    // 鼠标移动 - 光圈跟随
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
      underlying.style.background = 
        `radial-gradient(circle 320px at ${e.clientX}px ${e.clientY}px, transparent 0%, rgba(5,5,7,0.95) 40%, rgba(5,5,7,0.99) 100%)`;
    });
    
    // 点击淡出
    landing.addEventListener('click', () => {
      landing.classList.add('exit');
      setTimeout(() => {
        landing.style.display = 'none';
        window.location.href = 'index.html#main';
      }, 600);
    });
  </script>
</body>
</html>
