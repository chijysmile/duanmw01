<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>段默文 - 主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; font-family: 'Inter', sans-serif; background: #050507; color: #f0f0f2; }
    
    .landing {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #050507; z-index: 1000;
      cursor: pointer;
    }
    
    .layer {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    
    /* 表层 - 完全可见 */
    .surface-text {
      font-size: clamp(48px, 10vw, 120px);
      font-weight: 700; letter-spacing: -0.02em;
      color: #f0f0f2; /* 明亮的白色 */
    }
    
    /* 底层 - 光圈揭示，圆圈外完全隐藏 */
    .underlying {
      background: radial-gradient(circle 250px at var(--mx, 50%) var(--my, 50%), 
        transparent 0%, 
        rgba(5,5,7,0.98) 70%,
        rgba(5,5,7,1) 100%);
      -webkit-mask-image: radial-gradient(circle 250px at var(--mx, 50%) var(--my, 50%), 
        black 0%, 
        transparent 70%,
        transparent 100%);
      mask-image: radial-gradient(circle 250px at var(--mx, 50%) var(--my, 50%), 
        black 0%, 
        transparent 70%,
        transparent 100%);
    }
    
    .underlying h1 {
      font-size: clamp(48px, 10vw, 120px);
      font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #00d992, #00b4d8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px rgba(0, 217, 146, 0.6));
    }
    
    .underlying p { 
      margin-top: 24px; 
      font-size: 22px; 
      color: rgba(240, 240, 242, 0.9);
      text-shadow: 0 0 20px rgba(0, 217, 146, 0.4);
    }
    
    /* 光圈边框 */
    .cursor-circle {
      position: fixed; width: 200px; height: 200px;
      border: 2px solid rgba(0, 217, 146, 0.5);
      border-radius: 50%; pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1001; mix-blend-mode: screen;
      box-shadow: 0 0 30px rgba(0, 217, 146, 0.3),
                  inset 0 0 30px rgba(0, 217, 146, 0.1);
    }
    
    .hint {
      position: absolute; bottom: 60px; left: 50%;
      transform: translateX(-50%);
      font-size: 14px; color: rgba(107, 107, 120, 0.8);
      animation: pulse 2s infinite;
      letter-spacing: 0.1em;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: translateX(-50%) translateY(0); }
      50% { opacity: 0.7; transform: translateX(-50%) translateY(-3px); }
    }
    
    .exit { animation: fadeExit 0.6s forwards; }
    @keyframes fadeExit { 
      to { opacity: 0; visibility: hidden; transform: scale(1.02); } 
    }
  </style>
</head>
<body>
  <div class="cursor-circle" id="cursor"></div>
  
  <section class="landing" id="landing">
    <div class="layer">
      <div class="surface-text">I'm deMo1</div>
    </div>
    <div class="layer underlying" id="underlying">
      <h1>我是段默文</h1>
      <p>C++ 后端开发者</p>
    </div>
    <div class="hint">点击任意位置进入网站 ↓</div>
  </section>

  <script>
    const cursor = document.getElementById('cursor');
    const underlying = document.getElementById('underlying');
    const landing = document.getElementById('landing');
    
    // 鼠标移动 - 光圈跟随
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
      
      // 更新光圈位置和遮罩
      underlying.style.setProperty('--mx', e.clientX + 'px');
      underlying.style.setProperty('--my', e.clientY + 'px');
    });
    
    // 点击淡出
    landing.addEventListener('click', () => {
      landing.classList.add('exit');
      setTimeout(() => {
        landing.style.display = 'none';
        window.location.href = 'index.html#main';
      }, 600);
    });
  </script>
</body>
</html>
